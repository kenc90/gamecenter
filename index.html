<!DOCTYPE html>
<html lang="en" data-theme="xp">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Minesweeper</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&family=Quicksand:wght@500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="desktop">
    <!-- Matrix-style code rain (Virus theme only) -->
    <canvas id="matrixRain" class="matrix-rain" aria-hidden="true"></canvas>
    <div class="xp-window" id="gameWindow">
      <!-- Title bar -->
      <div class="title-bar">
        <div class="title-bar-inner">
          <span class="title-icon">
            <svg viewBox="0 0 16 16" width="16" height="16">
              <rect x="1" y="1" width="14" height="14" fill="#c0c0c0" stroke="#7b7b7b"/>
              <circle cx="8" cy="8" r="3.2" fill="#000"/>
              <g stroke="#000" stroke-width="1">
                <line x1="8" y1="2.5" x2="8" y2="13.5"/>
                <line x1="2.5" y1="8" x2="13.5" y2="8"/>
                <line x1="4" y1="4" x2="12" y2="12"/>
                <line x1="12" y1="4" x2="4" y2="12"/>
              </g>
              <circle cx="8" cy="8" r="3.2" fill="none" stroke="#000"/>
            </svg>
          </span>
          <span class="title-text">Minesweeper</span>
        </div>
        <div class="title-buttons">
          <button class="tb-btn minimize" title="Minimize" id="btnMin" aria-label="Minimize"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.4 7.2 H8.6" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></button>
          <button class="tb-btn maximize" title="Maximize" id="btnMax" aria-label="Maximize"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.4 2.2 H8.6 V8.6 H1.4 Z" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M1.4 2.2 H8.6" fill="none" stroke="currentColor" stroke-width="2.4"/></svg></button>
          <button class="tb-btn close" title="Close" id="btnClose" aria-label="Close"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.8 1.8 L8.2 8.2 M8.2 1.8 L1.8 8.2" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></button>
        </div>
      </div>

      <!-- Menu bar -->
      <div class="menu-bar" id="menuBar">
        <div class="menu-item" data-menu="game">
          <span class="menu-label"><u>G</u>ame</span>
          <div class="menu-dropdown">
            <button data-action="new"><u>N</u>ew</button>
            <hr />
            <button data-action="easy" data-check="level"><u>E</u>asy</button>
            <button data-action="medium" data-check="level">M<u>a</u>ximum</button>
            <button data-action="expert" data-check="level"><u>E</u>xpert</button>
            <hr />
            <button data-action="best-times"><u>B</u>est Times...</button>
            <hr />
            <button data-action="god-mode"><u>G</u>od Mode</button>
            <hr />
            <button data-action="exit">E<u>x</u>it</button>
          </div>
        </div>
        <div class="menu-item" data-menu="theme">
          <span class="menu-label"><u>T</u>heme</span>
          <div class="menu-dropdown">
            <button data-action="theme-xp" data-check="theme">Windows <u>X</u>P</button>
            <button data-action="theme-vista" data-check="theme">Windows <u>V</u>ista</button>
            <button data-action="theme-classic" data-check="theme">Classic <u>9</u>5</button>
            <button data-action="theme-cyberpunk" data-check="theme"><u>C</u>yberpunk</button>
            <button data-action="theme-virus" data-check="theme">V<u>i</u>rus</button>
            <button data-action="theme-ocean" data-check="theme"><u>O</u>cean</button>
            <button data-action="theme-crayon" data-check="theme">C<u>r</u>ayon</button>
          </div>
        </div>
        <div class="menu-item" data-menu="help">
          <span class="menu-label"><u>H</u>elp</span>
          <div class="menu-dropdown">
            <button data-action="how-to-play"><u>H</u>ow to Play</button>
            <hr />
            <button data-action="about">About Minesweeper</button>
          </div>
        </div>
      </div>

      <!-- Body / content -->
      <div class="game-body">
        <div class="bevel">
          <!-- Top panel: counters, smiley, timer -->
          <div class="top-panel">
            <div class="led-display" id="mineCounter" aria-label="Mines remaining"></div>
            <button class="smiley" id="smiley" title="New game" tabindex="-1"></button>
            <div class="led-display" id="timer" aria-label="Time"></div>
          </div>

          <!-- Mine field -->
          <div class="field-bevel">
            <div class="field" id="field"></div>
            <button class="rollback-btn" id="rollbackBtn" hidden title="Undo the fatal move"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3 L2 7 L6 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 7 H10 a4 4 0 0 1 0 8 H7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Rollback</button>
          </div>
        </div>
        <div class="status-bar" id="statusBar">Ready</div>
      </div>
    </div>

    <!-- Close / flash overlay -->
    <div class="overlay" id="overlay" hidden>
      <div class="overlay-msg" id="overlayMsg"></div>
    </div>
  </div>

  <div id="modal-root"></div>

  <script src="js/minesweeper.js"></script>
</body>
</html>
