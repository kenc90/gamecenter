<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Game Center">
  <!-- Shared site icon: a launcher grid with one tile lit. Shapes are chosen to
       survive a 16x16 raster — four chunky tiles, no hairlines, and a self-lit
       badge so it reads against both light and dark browser chrome. -->
  <defs>
    <!-- userSpaceOnUse so the badge and the "punched out" play mark share one
         continuous gradient, making the mark read as a hole in the tile. -->
    <linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0" stop-color="#3b6ff0"/>
      <stop offset="1" stop-color="#7b3bf0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#tile)"/>
  <rect width="64" height="64" rx="16" fill="url(#sheen)"/>

  <!-- unlit tiles -->
  <g fill="#fff" fill-opacity=".55">
    <rect x="12" y="12" width="18" height="18" rx="5"/>
    <rect x="34" y="12" width="18" height="18" rx="5"/>
    <rect x="12" y="34" width="18" height="18" rx="5"/>
  </g>
  <!-- lit tile + play mark -->
  <rect x="34" y="34" width="18" height="18" rx="5" fill="#fff"/>
  <path d="M40 38.5 L47.5 43 L40 47.5 Z" fill="url(#tile)" stroke="url(#tile)" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
